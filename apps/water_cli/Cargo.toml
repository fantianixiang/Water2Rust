[package]
name = "water_cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "water2rust"
path = "src/main.rs"

[dependencies]
water-core.workspace = true
water-io.workspace = true
water-gpu.workspace = true
water-fclass.workspace = true
water-hydro.workspace = true
water-edge-depth.workspace = true

anyhow.workspace = true
clap.workspace = true
geo.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# 启用 GPU 加速的 Laplace 水面求解：大水域（内部变量 ≥ 阈值）走 GPU 聚合多重网格 PCG，
# 小水域仍用 CPU faer（阈值分派 + fallback）。需 CUDA 环境（编译 water-gpu 的 .cu）。
gpu = ["water-hydro/gpu"]
